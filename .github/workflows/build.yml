name: Build MueblesNormsafio

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Locate pom.xml
        id: pom
        run: |
          POM=$(find . -name pom.xml -not -path '*/target/*' | head -n 1)
          echo "Found: $POM"
          if [ -z "$POM" ]; then echo "No pom.xml in repo"; exit 1; fi
          echo "path=$POM" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: mvn -B -f "${{ steps.pom.outputs.path }}" clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: MueblesNormsafio
          path: '**/target/MueblesNormsafio.jar'
          if-no-files-found: error
